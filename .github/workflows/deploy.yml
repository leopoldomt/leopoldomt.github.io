name: Deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Audit dependency security
        run: bin/security-check
      - name: Check dependency compatibility
        run: bundle exec ruby test/security_dependencies_test.rb
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Verify site and public paths
        run: python3 migration/verify.py
      - name: Disable GitHub Pages Jekyll processing
        run: touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true

  publish:
    needs: build
    # PRs and manual runs on other branches build for review but cannot publish.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: .
          clean: true
